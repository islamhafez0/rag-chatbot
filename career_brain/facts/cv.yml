title: "Curriculum Vitae (CV) downloads"
description: "Islam's CV is available as downloadable PDFs tailored to specific career paths. Always select the version matching the user's request."

versions:
  - label: "Frontend Developer CV"
    url: "/files/islam-hafez-frontend.pdf"
    use_when: "Frontend development, React, Next.js, TypeScript, Angular, web development, or unspecified specialty. Default choice."

  - label: "Odoo Developer CV"
    url: "/files/islam-hafez-odoo.pdf"
    use_when: "Odoo, OWL, ERP development, Python customizations, integrations, or business workflows."

  - label: "AI Engineer CV"
    url: "/files/islam-hafez-ai-engineer.pdf"
    use_when: "AI engineering, RAG, LLM applications, embeddings, AI agents, or LLM integration. Only include when the PDF exists and is current."

usage: "When asked for the CV or resume, select the version matching the conversation topic. Default to the Frontend Developer CV when no specialty is specified. Reply briefly with a Markdown download link. Only use exact URLs listed here; never invent filenames or links."