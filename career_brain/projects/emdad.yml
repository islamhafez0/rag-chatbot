name: Emdad
role: Odoo Developer at TaqaTechno
description: >
  A humanitarian storefront for which I extended Odoo 17's catalog model to power a
  live store. I added category flags, translatable descriptions and hero icons so
  the team curates the homepage directly from the ERP, plus role-gated pricing and
  a B2B quote flow for humanitarian partners.
highlights:
  - Extended Odoo's base catalog model for role-gated pricing and a B2B quote-to-order flow
  - Homepage curation from the ERP with category flags and hero icons
  - Storefront frontend built with OWL
  - Role-based access control for pricing and visibility
tech_stack:
  - Odoo 17
  - Python
  - OWL (Odoo Web Library)
  - PostgreSQL
