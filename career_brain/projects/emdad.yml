# Emdad - Humanitarian Storefront
# Extended Odoo's catalog model for a live humanitarian storefront.
title: "Emdad"
description: >
  A humanitarian-focused storefront that extends Odoo's catalog model to power a live storefront.
  I implemented category flags, translatable descriptions, and hero icons that allow the team
  to curate the homepage directly from the ERP.
tech_stack:
  - Odoo 17
  - Python
  - OWL (Odoo Web Library)
  - PostgreSQL
architecture:
  - "Extended Odoo's base catalog model to support role-gated pricing and a B2B quote flow."
  - "Built a custom curation system for the homepage using category flags and hero icons managed via the ERP."
contributions:
  - "Designed and implemented the role-based pricing logic."
  - "Developed the frontend storefront using OWL."
outcomes:
  - "Enabled efficient distribution of humanitarian aid via a structured digital storefront."
  - "Streamlined the quote-to-order process for B2B humanitarian partners."
lessons:
  - "Learned how to customize Odoo's core commerce models for non-standard business flows (Humanitarian aid)."
  - "Improved skills in developing role-based access control (RBAC) for pricing and visibility."
link: "https://github.com/islamhafez0/emdad"
