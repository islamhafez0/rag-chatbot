# Flagship project 5 of 7. Sources: portfolio project section (Odoo 19,
# MapTiler SDK, reliefcenter.com), previous knowledge base.
name: Relief Center
role: Odoo / full-stack developer at TaqaTechno
description: >
  A live disaster-response platform built on Odoo 19. It pulls real-time
  emergencies from NASA, USGS and GDACS into Odoo's ORM and renders them on an
  interactive 3D globe, with OTP-secured alerts for field coordinators.
highlights:
  - Live NASA, USGS and GDACS data streams hooked into Odoo's ORM so tracking updates automatically
  - 3D globe and geospatial layer built with OWL and the MapTiler SDK
  - OTP-secured, verified alerts for field coordinators
  - CRM flow to coordinate response teams
lessons:
  - Handling high-frequency geospatial data without slowing down Odoo's monolithic architecture
  - Integrating complex third-party APIs into Odoo's server-rendered flow
tech_stack:
  - Odoo 19
  - Python
  - OWL (Odoo Web Library)
  - MapTiler SDK
  - PostgreSQL
  - SCSS
links:
  - label: Live site
    url: https://reliefcenter.com
unknowns:
  - Source code is private.
