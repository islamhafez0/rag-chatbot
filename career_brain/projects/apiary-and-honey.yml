name: Apiary and Honey
description: Solo-built Odoo 17 ERP for end-to-end apiary management covering sites, colonies, batches, seasons, inspections, feeding, treatments, extractions, harvests, colony movements/permits, mortality tracking, cost accounting, and field data capture. Designed for traceability, compliance, and bilingual (Arabic/English) operations with role-based access control and custom reporting.
role: Odoo Developer
tech_stack:
  - Python
  - Odoo
  - JavaScript
  - HTML
  - CSS
  - SCSS
link: null
highlights:
  - Full traceability: colony lifecycle, events, inspections, treatments, feeding, extractions, harvests, movements/permits, and mortality
  - Costing and field operations: apiary cost accounting, field capture workflows, and site/season management
  - Bilingual UX (Arabic/English), custom QWeb/PDF reports, security/permissions, data models, and onboarding docs
