name: RAG Career Chatbot
description: >
  Retrieval-augmented career chatbot that answers questions about Islam Hafez
  from a personal knowledge base of structured YAML files. A Next.js API route
  orchestrates hybrid retrieval (pgvector exact vector search fused with
  Postgres full-text ranking via reciprocal rank fusion), adaptive context
  modes, backend-measured retrieval coverage notes, and a grounded streaming
  LLM answer rendered as Markdown plus optional rich visual blocks.
role: Solo Developer
tech_stack:
  - Next.js
  - TypeScript
  - PostgreSQL with pgvector
  - Gemini Embeddings (gemini-embedding-001)
  - Hybrid retrieval (vector + lexical RRF fusion)
  - Vercel AI SDK streaming
  - Ollama Cloud (gpt-oss:120b)
link: https://github.com/islamhafez0/rag-chatbot
highlights:
  - Entry-preserving YAML ingestion pipeline with per-entry chunking and a labeled character-split safety net for oversized entries, storing 3072-dim embeddings in pgvector
  - Hybrid retrieval fusing vector and lexical rankings with reciprocal rank fusion and a per-source diversity cap; measured mean recall@8 improved from 0.804 to 0.904 on the 23-scenario eval
  - Adaptive context modes (focused/expanded/complete) driven by a deterministic, zero-model-call intent classifier, with backend-computed coverage notes passed to the prompt
  - Grounded system prompt with verbatim-number rules, prompt-injection resistance, and a rich-ui JSON envelope for timelines, project cards, comparisons, and charts
