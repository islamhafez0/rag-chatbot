impact:
  - id: emdad-humanitarian-storefront
    category: odoo
    title: Emdad Humanitarian Storefront
    impact: >
      Extended Odoo 17's catalog model to power a live humanitarian
      storefront, enabling ERP-managed homepage curation, role-gated
      pricing, and B2B quote workflows.
    tech_stack: [Odoo 17, Python, E-commerce]

  - id: translation-dashboard
    category: odoo
    title: Odoo Translation Dashboard
    impact: >
      Built a dashboard that compares database translations with PO files
      and applies updates across the database, website, and translation
      files in one batch-SQL action, processing 6000+ terms in seconds.
      Fixed stale theme-copy translations.
    tech_stack: [Odoo 19, Python, OWL, PostgreSQL]

  - id: unlimited-menu-nesting
    category: odoo
    title: Unlimited Website Menu Nesting
    impact: >
      Removed Odoo's hardcoded two-level website menu limit and implemented
      viewport-aware nested dropdown behavior.
    tech_stack: [Odoo 17, Python, JavaScript]

  - id: relief-center
    category: odoo
    title: Relief Center Disaster Platform
    impact: >
      Built the OWL frontend for an interactive 3D disaster-monitoring globe
      integrating NASA, USGS, and GDACS data, with OTP-secured subscriber
      alerts and CRM-integrated coordination workflows.
    tech_stack: [Odoo 19, Python, OWL, JavaScript]

  - id: angular-fintech
    category: frontend
    title: Angular Fintech Platform
    impact: >
      Developed fintech workflows for KYC, SMS payments, instant payouts,
      and wallet funding, with AES-256 and HMAC API protection and
      maker-checker settlement controls.
    tech_stack: [Angular 17, TypeScript]

  - id: shopify-commerce
    category: ecommerce
    title: Advanced Shopify Commerce
    impact: >
      Implemented configurable pack variants, per-unit product selections,
      subscription exclusions for one-time checkouts, and storefront
      performance and accessibility improvements.
    tech_stack: [Shopify, JavaScript, Liquid]

  - id: apiary-and-honey
    category: odoo
    title: Apiary and Honey ERP
    impact: >
      Built an end-to-end apiary management ERP covering colony traceability,
      inspections, treatments, feeding, harvests, movements, permits,
      mortality, cost accounting, and field operations, with bilingual
      Arabic/English workflows and custom reporting.
    tech_stack: [Odoo, Python, JavaScript, SCSS]

  - id: open-source
    category: open-source
    title: Open-Source Contributions
    impact: >
      Record individual contributions, the original problem, implementation,
      and verified review or merge status.
    evidence: []

  - id: kaggle-llm-experiments
    category: ai-ml
    title: Local LLM Inference Experiments
    impact: >
      Experimented with quantized 27B GGUF models on Kaggle GPU instances,
      including llama.cpp compilation, GPU memory constraints, and inference
      server setup. Separate successful runs from incomplete attempts.
    tech_stack: [Python, GGUF, llama.cpp, CUDA, Kaggle]

  - id: career-rag
    category: ai-ml
    title: Career RAG Chatbot
    impact: >
      Built a career-focused retrieval-augmented generation system using
      hybrid vector and full-text retrieval to produce grounded answers
      from structured career knowledge.
    tech_stack: [Next.js, TypeScript, PostgreSQL, pgvector, LLMs]

  - id: portfolio-performance
    category: performance
    title: Portfolio Performance Optimization
    impact: >
      Achieved Lighthouse scores of 97 for mobile performance and 100 in
      other measured categories, with reported FCP of 0.5 seconds and
      LCP of 1.1 seconds.
    evidence:
      portfolio: "https://islamhafez.vercel.app/"