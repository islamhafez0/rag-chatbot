tell_me_about_yourself: >
  I'm Islam Hafez, a frontend developer and Odoo specialist based in Cairo. Since
  2024 I've built React and Next.js apps, two enterprise Angular 17 fintech panels,
  and Odoo 17/19 modules, themes and websites at TaqaTechno, including a paid Odoo
  app on the Odoo Apps store and this RAG chatbot.
why_should_we_hire_you: >
  I combine modern frontend skills (React, Next.js, TypeScript, Angular) with real
  Odoo ERP delivery in Python and OWL, so I can own a feature from the data model to
  a pixel-perfect UI. I write clean, maintainable code and care about performance.
biggest_strength: >
  I adapt fast to new technologies and still deliver polished, well-structured
  work, for example moving between Angular fintech panels, Odoo modules and Next.js apps.
