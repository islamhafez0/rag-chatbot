title: "Resolving a Design-to-Development Conflict"
competency: "Conflict Resolution & Communication"
situation: "While working on a custom Odoo theme at TaqaTechno, the UI/UX designer proposed a complex animation that was not natively supported by the Odoo Web Library (OWL) and would have significantly slowed down the page load time."
task: "I needed to balance the designer's vision for a high-end experience with the technical constraints of the Odoo framework and the requirement for performance."
action: "I scheduled a meeting with the designer to demonstrate the performance impact of the proposed animation using a prototype. I proposed an alternative using CSS-only transitions that achieved a similar visual effect without the JavaScript overhead."
result: "The designer agreed to the alternative, and the final implementation maintained a 90+ Lighthouse performance score while still looking visually appealing."
reflection: "I learned that presenting technical constraints through prototypes is more effective than simply saying 'it's not possible'."
related_experience: "experience/taqa-techno-odoo"
