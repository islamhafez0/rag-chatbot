<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620">
  <!-- Styles -->
  <defs>
    <style>
      .box { fill: #1e293b; stroke: #3b82f6; stroke-width: 2; rx: 8; }
      .box-green { fill: #1e293b; stroke: #10b981; stroke-width: 2; rx: 8; }
      .box-red { fill: #1e293b; stroke: #f43f5e; stroke-width: 2; rx: 8; }
      .box-purple { fill: #1e293b; stroke: #8b5cf6; stroke-width: 2; rx: 8; }
      .text { fill: #f8fafc; font-family: sans-serif; font-size: 14px; text-anchor: middle; dominant-baseline: middle; }
      .small { fill: #f8fafc; font-family: sans-serif; font-size: 11px; text-anchor: middle; }
      .label { fill: #94a3b8; font-family: sans-serif; font-size: 11px; text-anchor: middle; }
      .arrow { stroke: #64748b; stroke-width: 2; marker-end: url(#arrowhead); }
      .back { stroke: #38bdf8; stroke-width: 2; stroke-dasharray: 6 4; marker-end: url(#arrowhead-blue); }
      .title { fill: #38bdf8; font-family: sans-serif; font-size: 16px; font-weight: bold; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="620" fill="#0f172a" />

  <!-- ============ Ingestion lane ============ -->
  <text x="30" y="36" class="title" style="text-anchor: start">Ingestion (npm run ingest:pg — destructive rebuild)</text>

  <rect x="30" y="60" width="150" height="64" class="box" />
  <text x="105" y="84" class="text">YAML career_brain</text>
  <text x="105" y="104" class="label">29 files</text>

  <line x1="180" y1="92" x2="210" y2="92" class="arrow" />

  <rect x="210" y="60" width="190" height="64" class="box" />
  <text x="305" y="78" class="text">Entry chunking</text>
  <text x="305" y="96" class="small">1 entry = 1 chunk + labels</text>
  <text x="305" y="112" class="label">splitter safety net only · 40 chunks</text>

  <line x1="400" y1="92" x2="430" y2="92" class="arrow" />

  <rect x="430" y="60" width="190" height="64" class="box" />
  <text x="525" y="78" class="text">Gemini embedding</text>
  <text x="525" y="96" class="small">gemini-embedding-001</text>
  <text x="525" y="112" class="label">3072 dimensions</text>

  <line x1="620" y1="92" x2="650" y2="92" class="arrow" />

  <rect x="650" y="60" width="280" height="64" class="box-purple" />
  <text x="790" y="78" class="text">Postgres + pgvector</text>
  <text x="790" y="96" class="small">text · source · category · embedding · lexical tsvector</text>
  <text x="790" y="112" class="label">GIN lexical index · exact scan — no ANN (2000-dim cap)</text>

  <!-- ============ Runtime lane ============ -->
  <text x="30" y="176" class="title" style="text-anchor: start">Runtime (POST /api/chat — streams SSE back to UI)</text>

  <rect x="30" y="200" width="130" height="64" class="box-green" />
  <text x="95" y="224" class="text">Chat UI</text>
  <text x="95" y="244" class="label">useChat streaming</text>

  <line x1="160" y1="232" x2="190" y2="232" class="arrow" />

  <rect x="190" y="200" width="170" height="64" class="box" />
  <text x="275" y="218" class="text">API guard</text>
  <text x="275" y="236" class="small">validate roles / lengths</text>
  <text x="275" y="252" class="label">per-IP rate limit · safe JSON errors</text>

  <line x1="360" y1="232" x2="390" y2="232" class="arrow" />

  <rect x="390" y="200" width="180" height="64" class="box" />
  <text x="480" y="218" class="text">Query prep</text>
  <text x="480" y="236" class="small">bare / continuation / referential</text>
  <text x="480" y="252" class="label">deterministic · zero LLM calls</text>

  <line x1="570" y1="232" x2="600" y2="232" class="arrow" />

  <rect x="600" y="200" width="150" height="64" class="box" />
  <text x="675" y="218" class="text">Gemini embedding</text>
  <text x="675" y="236" class="small">query → 3072-d vector</text>
  <text x="675" y="252" class="label">same model as ingestion</text>

  <!-- Retrieval row -->
  <line x1="675" y1="264" x2="675" y2="300" class="arrow" />

  <rect x="440" y="300" width="470" height="88" class="box-purple" />
  <text x="675" y="320" class="text">pgvector retrieval (getContext)</text>
  <text x="675" y="340" class="small">vector-only cosine top-8 by default · hybrid RRF (vector + tsvector) via search: “hybrid”</text>
  <text x="675" y="358" class="small">3× oversample, max 3 chunks per source · category filter with &lt;2 hits retries unfiltered</text>
  <text x="675" y="376" class="label">explicit caller category only — no automatic routing</text>

  <!-- Generation row -->
  <line x1="480" y1="388" x2="480" y2="424" class="arrow" />

  <rect x="245" y="424" width="470" height="88" class="box-red" />
  <text x="480" y="444" class="text">System prompt + LLM (OpenAI-compatible)</text>
  <text x="480" y="464" class="small">first-person grounding · secret/salary refusal · injection resistance · canonical decline</text>
  <text x="480" y="484" class="small">history window LLM_MAX_HISTORY_TURNS · streamed via Vercel AI SDK</text>
  <text x="480" y="500" class="label">never leaks internals — 429/500 as safe JSON</text>

  <!-- Stream back to UI -->
  <path d="M 245 466 L 120 466 L 120 264 L 95 264" class="back" />
  <text x="150" y="450" class="label">SSE stream</text>

  <!-- Evals note -->
  <text x="30" y="556" class="label" style="text-anchor: start">Eval: eval:retrieve = vector-only Recall@1/@3/@8 + hit-rate gate · eval:answer = key-fact + decline checks (EVAL_SEARCH=vector|hybrid, default hybrid)</text>
  <text x="30" y="576" class="label" style="text-anchor: start">Request timeline in logs: prep (&lt;1ms) · embedding (~380ms) · vector search (~2ms) · LLM first token (~1–3s, provider-dependent)</text>
  <text x="30" y="596" class="label" style="text-anchor: start">Feedback KB is empty (0 chunks): “what do people say…?” must decline, not invent.</text>
</svg>
